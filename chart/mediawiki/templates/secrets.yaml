apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mw.fullname" . }}-settings
  labels:
    {{- include "mw.labels" . | nindent 4 }}
type: Opaque
data:
  settings.json: {{ .Values.localSettings.variables | toJson | b64enc | quote }}
  extra.php: {{ printf "<?php\n%s\n" .Values.localSettings.extraPhp | b64enc | quote }}
{{- if and (not .Values.mariadb.enabled) (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mw.dbSecret" . }}
type: Opaque
data:
  {{ .Values.externalDatabase.userKey }}: {{ .Values.externalDatabase.user | b64enc | quote }}
  {{ .Values.externalDatabase.passwordKey }}: {{ required "Set externalDatabase.password or existingSecret" .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- if not .Values.security.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mw.securitySecret" . }}
type: Opaque
data:
  secret-key: {{ required "Set security.secretKey or existingSecret; preserve old key for imports" .Values.security.secretKey | b64enc | quote }}
  upgrade-key: {{ required "Set security.upgradeKey or existingSecret" .Values.security.upgradeKey | b64enc | quote }}
{{- end }}
{{- if and .Values.bootstrap.enabled (not .Values.bootstrap.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mw.fullname" . }}-admin
type: Opaque
data:
  {{ .Values.bootstrap.passwordKey }}: {{ required "bootstrap.adminPassword or existingSecret required" .Values.bootstrap.adminPassword | b64enc | quote }}
{{- end }}
