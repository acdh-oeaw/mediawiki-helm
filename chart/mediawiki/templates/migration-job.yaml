{{- if .Values.migration.enabled }}
{{- if or (ne (int .Values.replicaCount) 0) .Values.bootstrap.enabled .Values.bitnamiImport.enabled }}
{{- fail "migration.enabled requires replicaCount=0; stop this chart's web pods before upgrading the schema" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s-r%d" (include "mw.fullname" . | trunc 28 | trimSuffix "-") (.Values.migration.runId | trunc 15 | trimSuffix "-") (int .Release.Revision) }}
  labels:
    {{- include "mw.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mw.selector" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "mw.waitDatabase" . | nindent 8 }}
      containers:
        - name: update
          image: {{ include "mw.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: [php, /var/www/html/maintenance/run.php, update, --quick]
          env:
            {{- include "mw.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            {{- include "mw.mounts" . | nindent 12 }}
      volumes:
        {{- include "mw.volumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
