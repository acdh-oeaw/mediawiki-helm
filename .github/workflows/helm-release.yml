name: Publish MediaWiki Helm chart
on:
  push:
    branches: [main]
    paths: ['chart/mediawiki/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mediawiki-helm-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/helm-ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - run: bash scripts/install-helm.sh
      - name: Package and publish immutable chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-chart.sh
